<style>
  .stats-container { max-width: 1300px; margin: 0 auto; padding: 20px; }
  .kpi-row { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .kpi-card {
    flex: 1; min-width: 180px; background: var(--card-bg, #ffffff);
    border: 1px solid var(--border, #e0e3e8); border-radius: 10px; padding: 20px;
    text-align: center;
  }
  .kpi-value { font-size: 28px; font-weight: 700; color: var(--accent, #2980b9); margin: 8px 0; }
  .kpi-label { font-size: 13px; color: var(--text-muted, #5a6c7d); text-transform: uppercase; }
  .kpi-sub { font-size: 12px; color: var(--text-muted, #5a6c7d); margin-top: 4px; }
  .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .chart-row.full { grid-template-columns: 1fr; }
  .chart-box {
    background: var(--card-bg, #ffffff); border: 1px solid var(--border, #e0e3e8);
    border-radius: 10px; padding: 16px;
  }
  .chart-box h3 { margin: 0 0 12px 0; font-size: 15px; color: var(--text, #2c3e50); }
  .chart-inner { width: 100%; height: 340px; }
  .low-data {
    text-align: center; padding: 80px 20px; color: var(--text-muted, #5a6c7d);
  }
  .low-data-icon { font-size: 64px; margin-bottom: 16px; }
  .low-data p { font-size: 15px; line-height: 1.8; }
  .date-range { font-size: 13px; color: var(--text-muted, #5a6c7d); margin-bottom: 20px; }
  @media (max-width: 900px) {
    .chart-row { grid-template-columns: 1fr; }
    .kpi-card { min-width: 140px; }
  }
</style>

<script>
(function() {
  var darkTheme = {
    textStyle: { color: '#5a6c7d' },
    title: { textStyle: { color: '#2c3e50' } },
    legend: { textStyle: { color: '#5a6c7d' } }
  };

  // ── 市场宽度 ──
  (function() {
    var dom = document.getElementById('chart-breadth');
    var chart = echarts.init(dom);
    chart.setOption({
      tooltip: { trigger: 'axis', valueFormatter: function(v) { return v + '%'; } },
      grid: { left: 50, right: 20, top: 20, bottom: 35 },
      xAxis: { type: 'category', data: _chartData.dates, axisLabel: { color: '#5a6c7d', rotate: 30 } },
      yAxis: { type: 'value', name: '涨跌比 %', axisLabel: { color: '#5a6c7d' }, min: 0, max: 100,
        splitLine: { lineStyle: { color: '#e0e3e8' } } },
      series: [{
        type: 'line', data: _chartData.up_ratio, smooth: true, symbol: 'circle', symbolSize: 6,
        lineStyle: { color: '#2980b9', width: 2 },
        itemStyle: { color: '#2980b9' },
        areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          { offset: 0, color: 'rgba(41,128,185,0.15)' },
          { offset: 1, color: 'rgba(41,128,185,0.05)' }
        ])},
        markLine: { silent: true, data: [{ yAxis: 50, lineStyle: { color: '#bdc3c7', type: 'dashed' } }],
          label: { formatter: '50%', color: '#bdc3c7' } }
      }]
    });
    window.addEventListener('resize', function() { chart.resize(); });
  })();

  // ── 南向资金（正=内资南下/负=回流A股）──
  (function() {
    var dom = document.getElementById('chart-south');
    var chart = echarts.init(dom);
    var vals = _chartData.south_flow;
    // 正=南下（偏空A股）红色；负=回流（偏多A股）绿色
    var colors = vals.map(function(v) { return v >= 0 ? '#e74c3c' : '#27ae60'; });
    chart.setOption({
      tooltip: { trigger: 'axis', valueFormatter: function(v) { return (v >= 0 ? '+' : '') + v.toFixed(1) + ' 亿'; } },
      grid: { left: 55, right: 20, top: 20, bottom: 35 },
      xAxis: { type: 'category', data: _chartData.dates, axisLabel: { color: '#5a6c7d', rotate: 30 } },
      yAxis: { type: 'value', name: '亿', axisLabel: { color: '#5a6c7d' },
        splitLine: { lineStyle: { color: '#e0e3e8' } } },
      series: [{
        type: 'bar',
        data: vals.map(function(v, i) { return { value: v, itemStyle: { color: colors[i] } }; }),
        markLine: { silent: true, symbol: 'none',
          data: [
            { yAxis: 0, lineStyle: { color: '#bdc3c7', type: 'solid' }, label: { show: false } },
            { yAxis: 30, lineStyle: { color: '#e74c3c', type: 'dashed' }, label: { formatter: '+30', color: '#e74c3c' } },
            { yAxis: -30, lineStyle: { color: '#27ae60', type: 'dashed' }, label: { formatter: '-30', color: '#27ae60' } }
          ]
        }
      }]
    });
    window.addEventListener('resize', function() { chart.resize(); });
  })();

  // ── 指数累计收益 ──
  (function() {
    var dom = document.getElementById('chart-index');
    var chart = echarts.init(dom);
    var colors = { '上证指数': '#e74c3c', '深证成指': '#27ae60', '创业板指': '#e67e22', '科创50': '#2980b9' };
    var series = [];
    var returns = _chartData.index_returns;
    for (var name in returns) {
      series.push({
        name: name, type: 'line', data: returns[name], smooth: true, symbol: 'circle', symbolSize: 4,
        lineStyle: { color: colors[name] || '#ccc', width: 2 },
        itemStyle: { color: colors[name] || '#ccc' }
      });
    }
    chart.setOption({
      tooltip: { trigger: 'axis', valueFormatter: function(v) { return v.toFixed(2) + '%'; } },
      legend: { data: Object.keys(returns), textStyle: { color: '#5a6c7d' }, bottom: 0 },
      grid: { left: 55, right: 20, top: 20, bottom: 40 },
      xAxis: { type: 'category', data: _chartData.dates, axisLabel: { color: '#5a6c7d', rotate: 30 } },
      yAxis: { type: 'value', name: '累计 %', axisLabel: { color: '#5a6c7d' },
        splitLine: { lineStyle: { color: '#e0e3e8' } } },
      series: series
    });
    window.addEventListener('resize', function() { chart.resize(); });
  })();

  // ── 板块轮动表格（条形图+累计排序+行底色）──
  (function() {
    var table = _chartData.sector_table;
    var dates = _chartData.sector_table_dates;
    if (!table || !table.length) return;

    var maxAbs = 0;
    table.forEach(function(r) {
      r.values.forEach(function(v) { if (Math.abs(v) > maxAbs) maxAbs = Math.abs(v); });
    });
    if (maxAbs === 0) maxAbs = 5;

    // 日期标签（MM-DD缩写）
    var dateLabels = dates.map(function(d) { return d.length >= 5 ? d.substring(5) : d; });

    var html = '<table class="data-table" style="font-size:13px;">';
    // 表头
    html += '<thead><tr><th style="min-width:90px;">板块</th>';
    dateLabels.forEach(function(d) { html += '<th style="text-align:center;min-width:70px;">' + d + '</th>'; });
    html += '<th style="text-align:center;min-width:70px;">5日累计</th></tr></thead><tbody>';

    table.forEach(function(row) {
      var cum = row.cumulative;
      // 行底色（5档）
      var bg = '';
      if (cum > 5) bg = 'rgba(231,76,60,0.06)';
      else if (cum > 2) bg = 'rgba(231,76,60,0.03)';
      else if (cum < -5) bg = 'rgba(39,174,96,0.06)';
      else if (cum < -2) bg = 'rgba(39,174,96,0.03)';

      html += '<tr style="background:' + bg + ';">';
      html += '<td style="font-weight:600;">' + row.name + '</td>';

      row.values.forEach(function(v) {
        var pctW = Math.abs(v) / maxAbs * 100;
        var barColor = v >= 0 ? '#e74c3c' : '#27ae60';
        var textColor = v >= 0 ? '#c0392b' : '#1e8449';
        var sign = v >= 0 ? '+' : '';
        html += '<td style="text-align:center;position:relative;padding:6px 4px;">'
          + '<div style="height:18px;position:relative;">'
          + '<div style="position:absolute;right:50%;top:0;height:100%;width:' + (pctW/2).toFixed(1) + '%;background:' + barColor + ';border-radius:2px;opacity:0.7;"></div>'
          + '<div style="position:absolute;left:50%;top:0;height:100%;width:' + (pctW/2).toFixed(1) + '%;background:' + barColor + ';border-radius:2px;opacity:0.7;display:' + (pctW > 0 ? 'block' : 'none') + ';"></div>'
          + '<span style="position:relative;z-index:1;font-size:12px;font-weight:600;color:' + textColor + ';">' + sign + v.toFixed(1) + '%</span>'
          + '</div></td>';
      });

      // 累计列
      var cumColor = cum >= 0 ? '#c0392b' : '#1e8449';
      var cumSign = cum >= 0 ? '+' : '';
      html += '<td style="text-align:center;font-weight:700;font-size:14px;color:' + cumColor + ';">' + cumSign + cum.toFixed(1) + '%</td>';
      html += '</tr>';
    });

    html += '</tbody></table>';
    document.getElementById('sector-table-container').innerHTML = html;
  })();
})();
</script>
