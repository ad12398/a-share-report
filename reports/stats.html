<!DOCTYPE html>

<link rel="stylesheet" href="/a-share-report/assets/css/dashboard.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  .stats-container { max-width: 1300px; margin: 0 auto; padding: 20px; }
  .kpi-row { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .kpi-card {
    flex: 1; min-width: 180px; background: var(--card-bg, #ffffff);
    border: 1px solid var(--border, #e0e3e8); border-radius: 10px; padding: 20px;
    text-align: center;
  }
  .kpi-value { font-size: 28px; font-weight: 700; color: var(--accent, #2980b9); margin: 8px 0; }
  .kpi-label { font-size: 13px; color: var(--text-muted, #5a6c7d); text-transform: uppercase; }
  .kpi-sub { font-size: 12px; color: var(--text-muted, #5a6c7d); margin-top: 4px; }
  .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .chart-row.full { grid-template-columns: 1fr; }
  .chart-box {
    background: var(--card-bg, #ffffff); border: 1px solid var(--border, #e0e3e8);
    border-radius: 10px; padding: 16px;
  }
  .chart-box h3 { margin: 0 0 12px 0; font-size: 15px; color: var(--text, #2c3e50); }
  .chart-inner { width: 100%; height: 340px; }
  .heatmap-inner { width: 100%; height: 600px; }
  .low-data {
    text-align: center; padding: 80px 20px; color: var(--text-muted, #5a6c7d);
  }
  .low-data-icon { font-size: 64px; margin-bottom: 16px; }
  .low-data p { font-size: 15px; line-height: 1.8; }
  .date-range { font-size: 13px; color: var(--text-muted, #5a6c7d); margin-bottom: 20px; }
  @media (max-width: 900px) {
    .chart-row { grid-template-columns: 1fr; }
    .kpi-card { min-width: 140px; }
  }
</style>
</head>

  <div class="chart-box">

<div class="chart-row">

  </div>
  <div class="chart-box">

  </div>
</div>

<div class="chart-row full">
  <div class="chart-box">
    <h3>🗺️ 板块轮动热力图</h3>
    <div class="heatmap-inner" id="chart-sector"></div>
  </div>
</div>



</div>


<script>

<script>
(function() {
  var darkTheme = {
    textStyle: { color: '#5a6c7d' },
    title: { textStyle: { color: '#2c3e50' } },
    legend: { textStyle: { color: '#5a6c7d' } }
  };

  // ── 市场宽度 ──
  (function() {
    var dom = document.getElementById('chart-breadth');
    var chart = echarts.init(dom);
    chart.setOption({
      tooltip: { trigger: 'axis', valueFormatter: function(v) { return v + '%'; } },
      grid: { left: 50, right: 20, top: 20, bottom: 35 },
      xAxis: { type: 'category', data: _chartData.dates, axisLabel: { color: '#5a6c7d', rotate: 30 } },
      yAxis: { type: 'value', name: '涨跌比 %', axisLabel: { color: '#5a6c7d' }, min: 0, max: 100,
        splitLine: { lineStyle: { color: '#e0e3e8' } } },
      series: [{
        type: 'line', data: _chartData.up_ratio, smooth: true, symbol: 'circle', symbolSize: 6,
        lineStyle: { color: '#2980b9', width: 2 },
        itemStyle: { color: '#2980b9' },
        areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          { offset: 0, color: 'rgba(41,128,185,0.15)' },
          { offset: 1, color: 'rgba(41,128,185,0.05)' }
        ])},
        markLine: { silent: true, data: [{ yAxis: 50, lineStyle: { color: '#bdc3c7', type: 'dashed' } }],
          label: { formatter: '50%', color: '#bdc3c7' } }
      }]
    });
    window.addEventListener('resize', function() { chart.resize(); });
  })();

  // ── 北向活跃度（双轴：柱=成交总额，线=外资占比）──
  (function() {
    var dom = document.getElementById('chart-north');
    var chart = echarts.init(dom);
    var turnover = _chartData.north_turnover;
    var participation = _chartData.north_participation;
    var colors = turnover.map(function(v) {
      return v > 300 ? '#e74c3c' : v > 150 ? '#e67e22' : '#95a5a6';
    });
    chart.setOption({
      tooltip: {
        trigger: 'axis',
        formatter: function(params) {
          var d = params[0].axisValue;
          var t = params[0].value, p = params[1].value;
          return d + '<br/>北向成交: ' + t.toFixed(0) + ' 亿<br/>外资占比: ' + p.toFixed(1) + '%';
        }
      },
      legend: { data: ['成交总额', '外资占比'], textStyle: { color: '#5a6c7d' }, bottom: 0 },
      grid: { left: 55, right: 55, top: 20, bottom: 40 },
      xAxis: { type: 'category', data: _chartData.dates, axisLabel: { color: '#5a6c7d', rotate: 30 } },
      yAxis: [
        { type: 'value', name: '亿', axisLabel: { color: '#5a6c7d' },
          splitLine: { lineStyle: { color: '#e0e3e8' } } },
        { type: 'value', name: '%', axisLabel: { color: '#5a6c7d' },
          splitLine: { show: false }, min: 0 }
      ],
      series: [
        { name: '成交总额', type: 'bar',
          data: turnover.map(function(v, i) { return { value: v, itemStyle: { color: colors[i] } }; }),
          markLine: { silent: true, symbol: 'none',
            data: [
              { yAxis: 300, lineStyle: { color: '#e74c3c', type: 'dashed' }, label: { formatter: '高', color: '#e74c3c' } },
              { yAxis: 150, lineStyle: { color: '#e67e22', type: 'dashed' }, label: { formatter: '中', color: '#e67e22' } }
            ]
          }
        },
        { name: '外资占比', type: 'line', yAxisIndex: 1, data: participation,
          smooth: true, symbol: 'circle', symbolSize: 5,
          lineStyle: { color: '#2980b9', width: 2 },
          itemStyle: { color: '#2980b9' },
          markLine: { silent: true, symbol: 'none',
            data: [
              { yAxis: 10, lineStyle: { color: '#e74c3c', type: 'dashed' }, label: { formatter: '10%', color: '#e74c3c' } },
              { yAxis: 5, lineStyle: { color: '#e67e22', type: 'dashed' }, label: { formatter: '5%', color: '#e67e22' } }
            ]
          }
        }
      ]
    });
    window.addEventListener('resize', function() { chart.resize(); });
  })();

  // ── 南向资金（正=内资南下/负=回流A股）──
  (function() {
    var dom = document.getElementById('chart-south');
    var chart = echarts.init(dom);
    var vals = _chartData.south_flow;
    // 正=南下（偏空A股）红色；负=回流（偏多A股）绿色
    var colors = vals.map(function(v) { return v >= 0 ? '#e74c3c' : '#27ae60'; });
    chart.setOption({
      tooltip: { trigger: 'axis', valueFormatter: function(v) { return (v >= 0 ? '+' : '') + v.toFixed(1) + ' 亿'; } },
      grid: { left: 55, right: 20, top: 20, bottom: 35 },
      xAxis: { type: 'category', data: _chartData.dates, axisLabel: { color: '#5a6c7d', rotate: 30 } },
      yAxis: { type: 'value', name: '亿', axisLabel: { color: '#5a6c7d' },
        splitLine: { lineStyle: { color: '#e0e3e8' } } },
      series: [{
        type: 'bar',
        data: vals.map(function(v, i) { return { value: v, itemStyle: { color: colors[i] } }; }),
        markLine: { silent: true, symbol: 'none',
          data: [
            { yAxis: 0, lineStyle: { color: '#bdc3c7', type: 'solid' }, label: { show: false } },
            { yAxis: 30, lineStyle: { color: '#e74c3c', type: 'dashed' }, label: { formatter: '+30', color: '#e74c3c' } },
            { yAxis: -30, lineStyle: { color: '#27ae60', type: 'dashed' }, label: { formatter: '-30', color: '#27ae60' } }
          ]
        }
      }]
    });
    window.addEventListener('resize', function() { chart.resize(); });
  })();

  // ── 指数累计收益 ──
  (function() {
    var dom = document.getElementById('chart-index');
    var chart = echarts.init(dom);
    var colors = { '上证指数': '#e74c3c', '深证成指': '#27ae60', '创业板指': '#e67e22', '科创50': '#2980b9' };
    var series = [];
    var returns = _chartData.index_returns;
    for (var name in returns) {
      series.push({
        name: name, type: 'line', data: returns[name], smooth: true, symbol: 'circle', symbolSize: 4,
        lineStyle: { color: colors[name] || '#ccc', width: 2 },
        itemStyle: { color: colors[name] || '#ccc' }
      });
    }
    chart.setOption({
      tooltip: { trigger: 'axis', valueFormatter: function(v) { return v.toFixed(2) + '%'; } },
      legend: { data: Object.keys(returns), textStyle: { color: '#5a6c7d' }, bottom: 0 },
      grid: { left: 55, right: 20, top: 20, bottom: 40 },
      xAxis: { type: 'category', data: _chartData.dates, axisLabel: { color: '#5a6c7d', rotate: 30 } },
      yAxis: { type: 'value', name: '累计 %', axisLabel: { color: '#5a6c7d' },
        splitLine: { lineStyle: { color: '#e0e3e8' } } },
      series: series
    });
    window.addEventListener('resize', function() { chart.resize(); });
  })();

  // ── 板块热力图 ──
  (function() {
    var dom = document.getElementById('chart-sector');
    var chart = echarts.init(dom);
    var sNames = _chartData.sector_names;
    var sDates = _chartData.sector_dates;
    var sData = _chartData.sector_data;
    var matrix = [];
    for (var i = 0; i < sNames.length; i++) {
      for (var j = 0; j < sDates.length; j++) {
        var val = sData[i][j];
        if (val !== null) {
          matrix.push([j, i, val]);
        }
      }
    }
    chart.setOption({
      tooltip: {
        position: 'top',
        formatter: function(p) {
          return sDates[p.value[0]] + '<br/>' + sNames[p.value[1]] + ': ' + p.value[2].toFixed(2) + '%';
        }
      },
      grid: { left: 100, right: 40, top: 15, bottom: 65, containLabel: true },
      xAxis: { type: 'category', data: sDates, axisLabel: { color: '#5a6c7d', rotate: 45, fontSize: 10, margin: 8 }, position: 'bottom' },
      yAxis: { type: 'category', data: sNames, axisLabel: { color: '#5a6c7d', fontSize: 12, width: 95, overflow: 'truncate' } },
      visualMap: {
        min: -5, max: 5, calculable: true, orient: 'horizontal',
        left: 'center', bottom: 8,
        pieces: [
          { min: -5, max: -3, color: '#c0392b' },
          { min: -3, max: -2, color: '#e74c3c' },
          { min: -2, max: -1, color: '#f1948a' },
          { min: -1, max: -0.3, color: '#fadbd8' },
          { min: -0.3, max: 0.3, color: '#bdc3c7' },
          { min: 0.3, max: 1, color: '#d5f5e3' },
          { min: 1, max: 2, color: '#82e0aa' },
          { min: 2, max: 3, color: '#27ae60' },
          { min: 3, max: 5, color: '#1e8449' }
        ],
        text: ['涨>5%', '跌<-5%'], textStyle: { color: '#5a6c7d' }
      },
      series: [{
        type: 'heatmap', data: matrix,
        label: { show: false },
        itemStyle: { borderWidth: 1, borderColor: '#fff' },
        emphasis: { itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.2)' } }
      }]
    });
    window.addEventListener('resize', function() { chart.resize(); });
  })();
})();
</script>


</body>
