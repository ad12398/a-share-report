name: A-Share Report Generator

on:
  schedule:
    # 北京时间 09:25（UTC 01:25）— 盘前简报
    - cron: "25 1 * * 1-5"
    # 北京时间 10:30（UTC 02:30）— 早盘分析
    - cron: "30 2 * * 1-5"
    # 北京时间 11:30（UTC 03:30）— 午盘总结
    - cron: "30 3 * * 1-5"
    # 北京时间 14:00（UTC 06:00）— 午后更新
    - cron: "0 6 * * 1-5"
    # 北京时间 15:00（UTC 07:00）— 收盘报告
    - cron: "0 7 * * 1-5"
  workflow_dispatch:
    inputs:
      slot:
        description: "报告时段"
        required: true
        type: choice
        options:
          - "0925"
          - "1030"
          - "1130"
          - "1400"
          - "1500"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SLOT=${{ inputs.slot }}" >> $GITHUB_ENV
          else
            # 根据 cron 触发时间自动判断时段
            # GitHub Actions 使用 UTC 时间
            HOUR=$(date -u +%H)
            MINUTE=$(date -u +%M)
            if [ "$HOUR" = "01" ]; then echo "SLOT=0925" >> $GITHUB_ENV; fi
            if [ "$HOUR" = "02" ]; then echo "SLOT=1030" >> $GITHUB_ENV; fi
            if [ "$HOUR" = "03" ]; then echo "SLOT=1130" >> $GITHUB_ENV; fi
            if [ "$HOUR" = "06" ]; then echo "SLOT=1400" >> $GITHUB_ENV; fi
            if [ "$HOUR" = "07" ]; then echo "SLOT=1500" >> $GITHUB_ENV; fi
          fi
          echo "Using slot: $SLOT"

      - name: Generate report
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python src/main.py --slot $SLOT

      - name: Prepare deploy directory
        run: |
          # 将 assets 和 data 复制到 reports 目录，使 GH Pages 能正确访问
          cp -r assets reports/
          cp -r data reports/
          # 确保有 index.html 作为首页
          if [ ! -f reports/index.html ]; then
            cp reports/index.html src/web/templates/index_fallback.html 2>/dev/null || true
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          keep_files: true
